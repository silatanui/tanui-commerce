# Optional thesis vector DB. From project root:
#   docker compose -f docker-compose.qdrant.yml up -d
# Then set AI_VECTOR_DRIVER=qdrant in .env and run: php artisan ai:reindex --fresh

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
